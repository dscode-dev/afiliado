services:
  postgres:
    image: postgres:16-alpine
    container_name: afiliado-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: afiliado
      POSTGRES_PASSWORD: afiliado
      POSTGRES_DB: afiliado
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - afiliado-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afiliado -d afiliado"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  afiliado-pgdata:
