# Terminacao TLS local para o Authorization Code do Mercado Livre.
#
# POR QUE ISTO EXISTE: o Mercado Livre exige `https` na URI de redirect e
# recusa `localhost`. Como a API fala HTTP puro, precisamos de alguem que
# termine TLS num hostname real. O hostname resolve para esta maquina pelo
# arquivo hosts do Windows -- nao ha DNS publico envolvido.
#
# Este proxy NAO e a forma de publicar em producao: la entra um reverse proxy
# de verdade, com certificado emitido por uma CA publica.

server {
    listen 80;
    server_name api-garimpo.allblue-labs.com;

    # O ML so redireciona para https. Qualquer acesso em texto claro vira
    # redirect, para nao existirem dois caminhos com comportamentos diferentes.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api-garimpo.allblue-labs.com;

    ssl_certificate     /etc/nginx/certs/garimpo-local.crt;
    ssl_certificate_key /etc/nginx/certs/garimpo-local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # O `code` do OAuth viaja na querystring: nada de access log aqui, senao a
    # credencial de uso unico fica gravada em disco.
    access_log off;

    location / {
        proxy_pass http://api:3333;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # A API precisa saber que a ponta original era HTTPS para montar
        # URLs e decidir sobre cookie seguro. Exige TRUST_PROXY ligado.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
